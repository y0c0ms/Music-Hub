name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, do **not** open an issue: use
        [private vulnerability reporting](https://github.com/y0c0ms/Music-Hub/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: Version
      description: From `GET /api/version` or the container tag.
      placeholder: v1.1.0
    validations: {required: true}
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options: [Web app (browser), Web app (installed PWA), Android app, Server / API, Downloads (yt-dlp), Other]
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations: {required: true}
  - type: textarea
    id: logs
    attributes:
      label: Server log lines
      description: Remove tokens, cookies and personal data first.
      render: text
