name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is hard or impossible today?
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: What would help
    validations: {required: true}
