# Weekly dependency updates, grouped so a week produces a handful of PRs rather
# than dozens. Security updates are separate and immediate (repository setting).
# Every update PR runs the full CI gate before it can merge.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    groups:
      rust-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, rust]

  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, javascript]

  - package-ecosystem: npm
    directory: /android-shell
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    groups:
      android-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, android]

  - package-ecosystem: gradle
    directory: /android-shell/android
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
    labels: [dependencies, android]

  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly, day: monday}
    labels: [dependencies, docker]
