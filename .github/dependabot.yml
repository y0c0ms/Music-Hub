# Weekly dependency updates, grouped so a week produces at most two PRs per
# ecosystem (minor/patch, and major) rather than one per package. A version must have been public for 7 days before it is proposed:
# hijacked releases are usually caught and yanked within that window. Security
# updates are separate and not delayed (repository setting).
# Every update PR runs the full CI gate before it can merge.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: {interval: weekly, day: monday}
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      rust-minor-patch:
        update-types: [minor, patch]
      rust-major:
        update-types: [major]
    labels: [dependencies, rust]

  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly, day: monday}
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      web-minor-patch:
        update-types: [minor, patch]
      web-major:
        update-types: [major]
    labels: [dependencies, javascript]

  - package-ecosystem: npm
    directory: /android-shell
    schedule: {interval: weekly, day: monday}
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      android-minor-patch:
        update-types: [minor, patch]
      android-major:
        update-types: [major]
    labels: [dependencies, android]

  - package-ecosystem: gradle
    directory: /android-shell/android
    schedule: {interval: monthly}
    groups:
      gradle:
        patterns: ["*"]
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels: [dependencies, android]

  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly, day: monday}
    groups:
      docker:
        patterns: ["*"]
    cooldown:
      default-days: 7
    labels: [dependencies, docker]

  # Python tools in the runtime image (docker/requirements.txt) and the CI
  # coverage tool (.github/ci-requirements.txt), both hash-pinned.
  - package-ecosystem: pip
    directory: /docker
    schedule: {interval: weekly, day: monday}
    cooldown:
      default-days: 7
    groups:
      python-image:
        patterns: ["*"]
    labels: [dependencies, python]

  - package-ecosystem: pip
    directory: /.github
    schedule: {interval: monthly}
    cooldown:
      default-days: 7
    groups:
      python-ci:
        patterns: ["*"]
    labels: [dependencies, ci]
