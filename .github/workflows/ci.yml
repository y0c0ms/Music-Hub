---
# Quality and security gates for every push and pull request. The release
# workflow (release.yml) calls this file and publishes nothing unless every job
# here passes.
#
# Every third-party action is pinned to a full commit SHA; the trailing comment
# is the tag, for humans. No repository secrets are needed: the Postgres service
# uses a throwaway password that exists only inside the job.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (fmt, clippy, test, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      # Production runs Postgres 18 with pgvector; migrations use uuidv7(),
      # which older majors lack. Without this service every database test
      # returns early and passes without running.
      postgres:
        image: pgvector/pgvector:pg18@sha256:c29f30688a9ad961691bdf0ec1650717cc132a5814619d80f80463d6e4c42e47
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: musichub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/musichub
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # diff-cover compares changed lines against origin/main.
          fetch-depth: 0
          persist-credentials: false

      - name: system tools for tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-mutagen postgresql-client

      - name: apply migrations
        run: |
          for f in migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # rust-embed compiles web/dist into the binary, so it must exist first.
      - name: build web bundle
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: rust toolchain
        run: rustup show active-toolchain

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy (pedantic and nursery, warnings denied)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: install cargo-llvm-cov
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b  # v2.90.1
        with:
          tool: cargo-llvm-cov@0.9.1

      # One instrumented run is both the test gate and the coverage source.
      # Single-threaded: the database tests share one schema.
      - name: tests with coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --lcov --output-path coverage/rust.lcov -- --test-threads=1

      - name: js tests with coverage
        working-directory: web
        run: >
          npx c8 --reporter=lcovonly --report-dir=../coverage/js
          sh -c 'node mock/saved.test.mjs && node mock/album-state.test.mjs && node mock/bookmark.test.mjs'

      # Total coverage must not drop below the floor recorded in
      # .github/coverage-floor (percent of Rust lines). Raise the floor in the
      # same pull request that raises coverage; lowering it is a reviewed choice.
      - name: total coverage floor
        run: |
          floor=$(cat .github/coverage-floor)
          total=$(awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{printf "%.2f", lh*100/lf}' coverage/rust.lcov)
          echo "rust line coverage ${total}% (floor ${floor}%)"
          awk -v t="$total" -v f="$floor" 'BEGIN{exit !(t+0 >= f+0)}'

      - name: set up python for diff-cover
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: install diff-cover
        run: python -m pip install diff-cover==10.6.0

      # Lines changed relative to main must be at least 95% covered.
      - name: new-code coverage gate
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        run: >
          diff-cover coverage/rust.lcov coverage/js/lcov.info
          --compare-branch=origin/main --fail-under=95

      - name: upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  audit:
    name: dependency advisories (cargo, npm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: install cargo-audit
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b  # v2.90.1
        with:
          tool: cargo-audit

      # Any advisory fails, including unmaintained/unsound warnings. A
      # deliberate exception goes in .cargo/audit.toml with its reason.
      - name: cargo audit
        run: cargo audit --deny warnings

      - name: set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"

      # Shipped code only: the web bundle's runtime deps and the Android
      # shell's. Build tooling (vite, svelte compiler, the Capacitor CLI) runs
      # on the build machine and never reaches a user, so it is not gated.
      - name: npm audit (web, runtime)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (android shell, runtime)
        working-directory: android-shell
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            git /repo --no-banner --redact --exit-code 1

  semgrep:
    name: semgrep (static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.181.0@sha256:81474464c1f07483ba0682a44787fd93c91397419762a04abe2bafaae396304b
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: semgrep
        run: semgrep --config auto --error

  image:
    name: container image (build, scan)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: trivy config (Dockerfile, workflows)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"

      - name: set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: build image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: music-hub:ci
          build-args: |
            MH_VERSION=ci-${{ github.sha }}
            MH_COMMIT=${{ github.sha }}

      # Zero fixable HIGH/CRITICAL in the OS packages and the bundled Python
      # (yt-dlp, mutagen) or the image is not releasable.
      - name: trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: music-hub:ci
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: smoke (binary starts and reports its config error)
        run: |
          out=$(docker run --rm music-hub:ci 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'Missing("OIDC_ISSUER")'
