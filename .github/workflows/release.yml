---
# Release: runs when a version tag (vX.Y.Z) is pushed.
#
# 1. `gates` runs the whole of ci.yml (tests, coverage floor, clippy, cargo/npm
#    audit, secret scan, semgrep, image CVE scan). Nothing below runs unless
#    every one of those jobs passes.
# 2. `image` builds and pushes ghcr.io/<owner>/music-hub, scans the PUSHED
#    digest again, and attests its build provenance.
# 3. `apk` builds the Android shell with the tag's version, so the in-app
#    updater (which compares versionName to the newest release tag) agrees.
# 4. `publish` creates the GitHub release with the APK and its checksum.
#
# Only the automatic GITHUB_TOKEN is required. Optional secrets for a signed
# APK: ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD. Without them the APK is built unsigned and the release
# says so.
name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  gates:
    name: quality and security gates
    uses: ./.github/workflows/ci.yml

  image:
    name: publish image
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/music-hub
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: build and push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MH_VERSION=${{ github.ref_name }}
            MH_COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true

      # The gate scanned an image built from the same commit; this scans the
      # exact digest users pull, so a base layer that changed between the two
      # builds cannot slip through.
      - name: trivy scan of the pushed digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/music-hub@${{ steps.push.outputs.digest }}
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/music-hub
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  apk:
    name: build Android APK
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: set up java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: set up android sdk
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4

      - name: set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: android-shell/package-lock.json

      - name: install shell dependencies and sync
        working-directory: android-shell
        run: |
          npm ci
          npx cap sync android

      # vX.Y.Z -> versionName X.Y.Z, versionCode X*10000+Y*100+Z. The updater
      # compares versionName with the release tag, so both come from the tag.
      - name: stamp version from tag
        working-directory: android-shell/android/app
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          IFS=. read -r major minor patch <<EOF
          $v
          EOF
          code=$((major * 10000 + minor * 100 + patch))
          sed -i -E "s/^( *versionName ).*/\1\"$v\"/; s/^( *versionCode ).*/\1$code/" build.gradle
          grep -nE 'versionName|versionCode' build.gradle

      - name: signing material (optional)
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir" && chmod 700 "$dir"
          echo "$KS_B64" | base64 -d > "$dir/release.jks"
          {
            echo "storeFile=$dir/release.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > "$dir/keystore.properties"
          chmod 600 "$dir"/*
          echo "MH_KEYSTORE_PROPERTIES=$dir/keystore.properties" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: assemble release APK
        working-directory: android-shell/android
        run: ./gradlew --no-daemon assembleRelease

      - name: name and checksum the APK
        env:
          TAG: ${{ github.ref_name }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          mkdir -p dist
          src=$(find android-shell/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          suffix=""
          [ "$SIGNED" = "true" ] || suffix="-unsigned"
          cp "$src" "dist/music-hub-${TAG#v}${suffix}.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"

      - name: upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: apk
          path: dist/
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [image, apk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: download APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: apk
          path: dist

      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          notes="Container image: \`ghcr.io/${OWNER}/music-hub:${TAG#v}\` (digest \`${DIGEST}\`).

          Every gate in ci.yml passed for this commit: tests with a coverage floor, clippy, cargo and npm audit, secret scan, semgrep, and a trivy scan with zero fixable HIGH/CRITICAL findings (repeated on the pushed digest)."
          gh release create "$TAG" dist/* --repo "$REPO" --title "$TAG" --notes "$notes" --verify-tag
