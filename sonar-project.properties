# SonarQube "Clean as You Code" gate. The hard new-code-95% check is enforced by
# diff-cover in CI (language-agnostic); SonarQube adds the overall non-decreasing
# ratchet plus issue/security analysis and ingests the lcov reports for history.
sonar.projectKey=music-hub
sonar.projectName=music-hub

sonar.sources=crates,web/src
sonar.tests=web/mock
sonar.test.inclusions=**/*.test.mjs
sonar.exclusions=**/target/**,web/dist/**,web/node_modules/**,android-shell/**

# Coverage reports produced by the CI pipeline.
sonar.rust.lcov.reportPaths=coverage/rust.lcov
sonar.javascript.lcov.reportPaths=coverage/js/lcov.info

# New code = anything different from main; the ratchet is measured against it.
sonar.newCode.referenceBranch=main
